[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-stt-plugin-elevenlabs"
version = "0.1.0"
description = "ElevenLabs Scribe speech-to-text plugin for OpenVoiceOS"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Collins1738"}
]
keywords = ["mycroft", "ovos", "plugin", "stt", "elevenlabs", "scribe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ovos-plugin-manager>=2.1.1,<3.0.0",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[project.urls]
Homepage = "https://github.com/Collins1738/ovos-stt-plugin-elevenlabs"

[project.entry-points."opm.stt"]
"ovos-stt-plugin-elevenlabs" = "ovos_stt_plugin_elevenlabs:ElevenLabsScribeSTT"

[project.entry-points."opm.stt.config"]
"ovos-stt-plugin-elevenlabs.config" = "ovos_stt_plugin_elevenlabs:ElevenLabsScribeSTTConfig"

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_stt_plugin_elevenlabs*"]
